# =============================================================================
# harness アセット同期ワークフロー(取り込み側リポジトリに置く)
# -----------------------------------------------------------------------------
# 手動実行(workflow_dispatch)で agentic-dev-harness の最新 main から
# linear-worker と Git 運用ルール(SYNC_PATHS のパス)を取り込み直す。
# 差分がある時だけ "chore: sync harness assets" としてコミットする。
#
# - 同期するのは harness が所有するパス(SYNC_PATHS)だけ。ディレクトリは丸ごと harness
#   管理なので、配布元で削除されたファイルは取り込み側からも削除して揃える。
#   それ以外(.claude/settings.json、自作 skill、.kiro/specs 等)には触れない
# - SDD ワークフロー(kiro commands / dev-orchestrator / .kiro/settings / AGENTS.md)は
#   本ワークフローの対象外。unity-sdd-kit(https://github.com/Hidano-Dev/unity-sdd-kit)
#   の同期ワークフローで取り込む
# - ルート CLAUDE.md は、Git 運用ルールの import 行(CLAUDE_MD_IMPORT)が無い場合だけ
#   末尾に追記する(それ以外の内容には触れない)
# - .kiro/orchestration/config.json はコピーしないが、配布元が定義した移行
#   (.claude/skills/linear-worker/scripts/migrate_config.py。対象は auto_merge のみ)を
#   1 度ずつ適用する。適用済みの移行は config の applied_migrations に記録され、
#   その後に人間が値を戻しても再適用しない
# - このワークフロー自体(.github/workflows/)は GITHUB_TOKEN では更新できないため同期しない。
#   配布版と異なる場合は警告するので、templates/consumer/harness-sync.yml で差し替える
# - 取り込み元が public リポジトリなのでトークン不要。private にする場合は
#   checkout 用の PAT を secret に置き、clone URL に埋め込む
#
# 配置先: .github/workflows/harness-sync.yml
# =============================================================================
name: Harness Sync

on:
  workflow_dispatch:
  # 定期的に追従したい場合は以下を有効化
  # schedule:
  #   - cron: '0 21 * * 0'   # 毎週月曜 06:00 JST

env:
  # 配布元(agentic-dev-harness)
  HARNESS_REPO: Hidano-Dev/agentic-dev-harness
  HARNESS_REF: main
  # 取り込むパス(空白区切り。harness が所有するパスのみ)
  SYNC_PATHS: ".claude/skills/linear-worker .claude/rules/git-workflow.md"
  # ルート CLAUDE.md に必要な import 行
  CLAUDE_MD_IMPORT: "@.claude/rules/git-workflow.md"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 同期先(とその途中のディレクトリ・配下)にシンボリックリンクがあると cp はリンク先へ
      # 書き込み、後続の git add -A / push が無関係なファイルの変更を既定ブランチへ直接反映して
      # しまう。同期先が submodule(gitlink, mode 160000)だと、書き込んでも superproject の
      # git add に乗らず、更新されないまま正常終了に見える。どちらもコピー前に検査して失敗させる
      - name: Refuse symlinks and submodules under sync targets
        run: |
          bad=""
          for p in $SYNC_PATHS CLAUDE.md; do
            # 途中のディレクトリ(.claude、.claude/skills 等)がリンクでも submodule でもないこと
            # (祖先が gitlink だと、配下のパスは git ls-files に現れないため個別に見る)
            cur=""
            IFS=/ read -ra parts <<< "$p"
            for part in "${parts[@]}"; do
              cur="${cur:+$cur/}$part"
              if [ -L "$cur" ]; then bad="$bad$cur"$'\n'; break; fi
              if git ls-files --stage -- "$cur" | awk -v p="$cur" '$1 == "160000" && $4 == p { found = 1 } END { exit !found }'; then
                bad="$bad$cur (submodule)"$'\n'; break
              fi
            done
            if [ -d "$p" ] && [ ! -L "$p" ]; then
              found=$(find "$p" -type l -print)
              if [ -n "$found" ]; then bad="$bad$found"$'\n'; fi
            fi
          done
          gitlinks=$(git ls-files --stage -- $SYNC_PATHS | awk '$1 == "160000" { print $4 " (submodule)" }')
          if [ -n "$gitlinks" ]; then bad="$bad$gitlinks"$'\n'; fi
          if [ -n "$bad" ]; then
            echo "::error::同期先にシンボリックリンクまたは submodule があるため同期を中止しました(通常のファイル・ディレクトリにしてから再実行してください): $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi

      - name: Import latest harness assets
        run: |
          git clone --depth 1 --branch "$HARNESS_REF" --single-branch "https://github.com/${HARNESS_REPO}.git" /tmp/harness
          for p in $SYNC_PATHS; do
            src="/tmp/harness/$p"
            if [ ! -e "$src" ]; then
              echo "::warning::$p は配布元に存在しないためスキップしました"
              continue
            fi
            mkdir -p "$(dirname "$p")"
            if [ -d "$src" ]; then
              # ディレクトリは harness 管理なので、配布元に無いファイルを残さないよう丸ごと置き換える
              rm -rf "$p"
              cp -R "$src" "$p"
            else
              cp -f "$src" "$p"
            fi
          done
          wf=.github/workflows/harness-sync.yml
          if [ -f "$wf" ] && ! cmp -s /tmp/harness/templates/consumer/harness-sync.yml "$wf"; then
            echo "::warning::$wf が配布版(${HARNESS_REPO} の templates/consumer/harness-sync.yml)と異なります。独自の変更が無ければ配布版に差し替えてください"
          fi
          rm -rf /tmp/harness

      # Git 運用ルール(linear-worker の入口を含む)は CLAUDE.md の import 行から読み込まれる。
      # 行が無ければ末尾に追記する(既存の内容には触れない)
      - name: Ensure CLAUDE.md import
        run: |
          if [ -f CLAUDE.md ] && grep -qxF "$CLAUDE_MD_IMPORT" CLAUDE.md; then
            exit 0
          fi
          if [ -s CLAUDE.md ] && [ -n "$(tail -c1 CLAUDE.md)" ]; then echo >> CLAUDE.md; fi
          if [ -s CLAUDE.md ]; then echo >> CLAUDE.md; fi
          echo "$CLAUDE_MD_IMPORT" >> CLAUDE.md
          echo "::notice::CLAUDE.md に $CLAUDE_MD_IMPORT を追記しました"

      # config.json は同期対象外だが、雛形のプレースホルダが残ったまま・JSON として壊れたまま
      # だと linear-worker が誤動作するので、同期のついでに検査して警告する
      - name: Check orchestration config
        run: |
          f=.kiro/orchestration/config.json
          if [ ! -f "$f" ]; then
            echo "::notice::$f が無いため linear-worker は起動しません(Git 運用ルールのみ)"
          else
            python3 -c "import json,sys; json.load(open('$f'))" \
              || { echo "::error::$f が JSON として不正です"; exit 1; }
            if grep -qE '"<[^"]*>"' "$f"; then
              echo "::warning::$f に雛形のプレースホルダ(<...>)が残っています"
            fi
          fi

      # 雛形の既定値を変えても既存の config.json には届かないので、配布元が定義した
      # auto_merge の移行を未適用のものだけ適用する(適用内容は notice に出す)
      - name: Apply orchestration config migrations
        run: |
          m=.claude/skills/linear-worker/scripts/migrate_config.py
          if [ -f .kiro/orchestration/config.json ] && [ -f "$m" ]; then
            python3 "$m" .kiro/orchestration/config.json
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync harness assets"
          git push
