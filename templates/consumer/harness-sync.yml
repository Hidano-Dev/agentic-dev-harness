# =============================================================================
# Harness Sync v2(取り込み側リポジトリに置く。agentic-dev-harness が配布)
# -----------------------------------------------------------------------------
# 配布元(agentic-dev-harness)の main に追従し、差分があれば同期 PR を作って自動マージを予約する。
#
# - 既定ブランチへの push・毎日 1 回・手動実行で動く。配布元 main の sha が `.harness/version` と
#   同じなら即終了(安価)。同じ sha の同期 PR が開いていても終了
# - 適用の本体は配布元の scripts/sync/apply_sync.py(clone した配布元から実行する):
#   配布物(sync-manifest.json の owned。ディレクトリは丸ごと置換)・配布ワークフロー
#   (このファイル・docs-policy.yml・policy-gate.yml 等)のコピー、ルート CLAUDE.md の
#   import 行の保証、.kiro/orchestration/config.json の検査と移行(migrate_config.py)、
#   `.harness/version` の記録。同期先のシンボリックリンク・submodule・.gitignore による除外は
#   検出して中止する
# - 同期 PR(ブランチ chore/harness-sync-<sha7>、ラベル harness-sync)は policy-gate が
#   「配布元の指定コミットの適用結果と完全一致」を検証するので、人間の承認なしで自動マージされる。
#   古い同期 PR はクローズしてブランチを削除する
# - GitHub App のトークンが必須(GITHUB_TOKEN ではワークフローを更新できず、push で CI も起動しない)。
#   組織 secret HARNESS_APP_ID / HARNESS_APP_PRIVATE_KEY が無ければ warning を出して終了する
# - 配布物(.claude/skills/linear-worker 等)はこのリポジトリで直接編集しない(policy-gate が失敗させる)
# - 取り込み元が public リポジトリである前提(clone にトークンを使わない)
#
# 配置先: .github/workflows/harness-sync.yml
# =============================================================================
name: Harness Sync

on:
  push:
  schedule:
    - cron: '17 20 * * *'   # 毎日 05:17 JST
  workflow_dispatch:

concurrency:
  group: harness-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 配布元(agentic-dev-harness)
  HARNESS_REPO: Hidano-Dev/agentic-dev-harness
  HARNESS_REF: main

jobs:
  sync:
    # push は既定ブランチへのものだけ(作業ブランチへの push では動かない)
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Preflight
        id: pre
        env:
          APP_ID: ${{ secrets.HARNESS_APP_ID }}
          APP_KEY: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
        run: |
          if [ "$GITHUB_REPOSITORY" = "$HARNESS_REPO" ]; then
            echo "::notice::配布元自身では同期しません"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::warning::secret HARNESS_APP_ID / HARNESS_APP_PRIVATE_KEY が無いため同期をスキップしました(GITHUB_TOKEN ではワークフローの更新も CI の起動もできない)"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sha=$(git ls-remote "https://github.com/${HARNESS_REPO}.git" "refs/heads/${HARNESS_REF}" | cut -f1)
          if [ -z "$sha" ]; then
            echo "::error::${HARNESS_REPO} の ${HARNESS_REF} を取得できません"; exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app
        if: steps.pre.outputs.run == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pre.outputs.name }}

      - name: Resolve default branch
        id: repo
        if: steps.pre.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ steps.pre.outputs.sha }}
        run: |
          branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          echo "default_branch=$branch" >> "$GITHUB_OUTPUT"
          # 同じ sha の同期 PR が開いていれば何もしない
          open=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --label harness-sync --limit 100 \
            --json headRefName --jq "[.[] | select(.headRefName == \"chore/harness-sync-${SHA:0:7}\")] | length")
          if [ "$open" != "0" ]; then
            echo "::notice::${SHA:0:7} の同期 PR が既に開いています"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.repo.outputs.run == 'true'
        with:
          ref: ${{ steps.repo.outputs.default_branch }}
          token: ${{ steps.app.outputs.token }}

      - name: Check current version
        id: cur
        if: steps.repo.outputs.run == 'true'
        env:
          SHA: ${{ steps.pre.outputs.sha }}
        run: |
          cur=$(python3 -c "import json,sys; print(json.load(open('.harness/version')).get('sha',''))" 2>/dev/null || true)
          if [ "$cur" = "$SHA" ]; then
            echo "::notice::${HARNESS_REPO}@${SHA:0:7} は適用済みです"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Apply harness and open sync PR
        if: steps.cur.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ steps.pre.outputs.sha }}
          DEFAULT_BRANCH: ${{ steps.repo.outputs.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          h="$RUNNER_TEMP/harness"
          git clone --quiet --no-checkout "https://github.com/${HARNESS_REPO}.git" "$h"
          git -C "$h" -c advice.detachedHead=false checkout --quiet --detach "$SHA"
          python3 -I "$h/scripts/sync/apply_sync.py" --harness "$h" --target . --sha "$SHA" \
            --harness-repo "$HARNESS_REPO" --ref "$HARNESS_REF"
          python3 -I "$h/scripts/sync/publish_sync_pr.py" --target . --repo "$GITHUB_REPOSITORY" \
            --base "$DEFAULT_BRANCH" --sha "$SHA" --harness-repo "$HARNESS_REPO" --run-url "$RUN_URL"
