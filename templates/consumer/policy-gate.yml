# =============================================================================
# Policy Gate(取り込み側リポジトリに置く。agentic-dev-harness が配布)
# -----------------------------------------------------------------------------
# develop の branch protection の必須チェック `policy-gate`(job 名。変えないこと)。
# 判定の本体は配布物の .claude/skills/linear-worker/scripts/policy_gate.py:
#
#   1. 不変条件(.harness/invariants.json): 方針文書から必須の記述が消えていないこと
#   2. 同期 PR(.harness/version を更新する PR): 配布元の指定コミットを適用した結果と
#      完全一致すれば成功(人間の承認は不要。誰が作った PR でも内容だけで判定する)。
#      一致を確かめられなかった同期 PR は人間の承認で通す
#   3. 同期 PR 以外での配布物(.claude/skills/linear-worker 等)の直接編集は失敗(配布元で直して同期する)
#   4. コアパス(config の auto_merge.protected_paths)の変更は、現在の head に対する
#      人間(OWNER / MEMBER / COLLABORATOR)の承認があれば成功
#   Release PR(head = config の github.default_branch、base = github.release_branch)は 2・3 を
#   行わず、コア・配布物に触れていれば人間の承認を求める
#
# - PR が判定ロジック自体を書き換えて通すのを防ぐため、policy_gate.py は base 側のものを使う
#   (base にまだ無い導入 PR のときだけ head 側)
# - レビューの提出・取り消しでも再評価する(policy-gate-recheck.yml → policy-gate-relabel.yml が
#   ラベル policy-gate-recheck を付け直す。承認が付いたら緑になる)
# - このワークフローは base ブランチに存在して初めて動く。導入 PR(このファイルを足す同期 PR)では
#   動かないので、導入 PR は人間がマージする
# - 配置先: .github/workflows/policy-gate.yml(Harness Sync が更新する)
# =============================================================================
name: Policy Gate

# pull_request_target: ワークフローの定義を base ブランチから取る(PR がこのファイルを書き換えて
# ゲートを無効化できないようにする)。PR のコードは checkout するが**実行しない**(policy_gate.py は
# base から取り出して -I で実行し、PR の内容は git のデータとして読むだけ)。
# レビューの提出・取り消しでの再評価は policy-gate-recheck.yml がラベル policy-gate-recheck を
# 付け直して labeled イベントで起こす(pull_request_target にはレビューのイベントが無いため)
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: policy-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  # 配布元(agentic-dev-harness)。同期 PR の検証では、この repo の HARNESS_REF に含まれる
  # コミットだけを正しい配布物とみなす
  HARNESS_REPO: Hidano-Dev/agentic-dev-harness
  HARNESS_REF: main

jobs:
  policy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Evaluate policy gate
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # Release PR(作業ブランチ → リリースブランチ)の判定に使う
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          s=.claude/skills/linear-worker/scripts/policy_gate.py
          gate="$RUNNER_TEMP/policy_gate.py"
          if git cat-file -e "$BASE_SHA:$s" 2>/dev/null; then
            git show "$BASE_SHA:$s" > "$gate"
          elif [ -f "$s" ]; then
            # 導入 PR だけは head 側を使う。pull_request_target では PR のコードを実行することになるので、
            # 同一リポジトリの PR に限る(fork の PR では失敗させる)
            if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::base に $s が無く、fork の PR のため head 側のスクリプトも実行できません"
              exit 1
            fi
            echo "::notice::base に $s が無いため head 側を使います(導入 PR)"
            cp "$s" "$gate"
          else
            echo "::notice::$s が無いため検査をスキップしました(Harness Sync で配布物を取り込んでください)"
            exit 0
          fi
          python3 -I "$gate" --repo-dir . --base "$BASE_SHA" --head "$HEAD_SHA" \
            --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
            --harness-repo "$HARNESS_REPO" --harness-ref "$HARNESS_REF" \
            --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --head-repo "$HEAD_REPO"
