# 実行リポジトリ台帳
# -----------------------------------------------------------------------------
# 本リポジトリの配布物(linear-worker + Git 運用ルール)を取り込んでいるリポジトリと、
# その上で動く Routine(定期実行)の一覧。配布物には含まれない(台帳専用)。
# SDD ワークフロー一式は 2026-10-02 に unity-sdd-kit へ移管した(docs/changelog.md)。
#
# フィールド:
#   github        … owner/name
#   role          … execution(実行リポジトリ) | template(生成テンプレート。自身は実行しない)
#                   | distributor(別系統の配布元。本リポジトリの配布物は取り込まない)
#   sync          … workflow(取り込み側の同期ワークフローで追従) | manual(手動コピー)
#                   | template-init(旧 unity-sdd-template 生成先。orchestration-sync.yml で追従していた旧経路)
#                   | none(取り込まない)
#   harness       … linear-worker を動かしているか。null なら linear-worker なし
#     config      … .kiro/orchestration/config.json の有無(true / false / pending)
#     linear      … チーム / プロジェクト
#     routine     … claude.ai/code/routines 上の Routine(名前・cron は UTC・ID)
#     status      … pilot(試験運用) | active | paused
#   notes         … 台帳を読む人向けの補足
# -----------------------------------------------------------------------------

repos:
  - name: unity-renderer
    github: Hidano-Dev/unity-renderer
    role: execution
    sync: workflow   # .github/workflows/harness-sync.yml(SYNC_PATHS から AGENTS.md を除外)
    harness:
      config: true
      linear:
        team: Hidano
        project: unity-renderer
        labels:
          needs_human: needs-human
          needs_local: needs-unity
      routine:
        name: 自律駆動ハーネス
        cron: "52 * * * *"   # 毎時 52 分(UTC)
        id: trig_015wYjcF8kMmMqE9NqDLJWkj
        connectors: [Linear, Notion, Claude-Docs]
      status: pilot
    notes: >-
      ハーネスの試験実装リポジトリ(2026-09-23〜)。2026-09-25 に配布版へ揃え、
      config.json と Harness Sync ワークフローを導入済み(unity-renderer PR #28)。
      AGENTS.md に artgraph の節を追記しているため、同期時は AGENTS.md を対象から外すこと。

  - name: unity-sdd-kit
    github: Hidano-Dev/unity-sdd-kit
    role: distributor
    sync: none
    harness: null
    notes: >-
      旧 unity-sdd-template。2026-10-02 に Unity プロジェクト生成部分を unity-project-template へ分離し、
      本リポジトリから SDD ワークフロー一式を引き取って SDD の正本(Unity 向け拡張込み)になった。
      本リポジトリの配布物とは所有パスが重ならず、取り込み側では両方の同期ワークフローが共存する。

  - name: unity-project-template
    github: Hidano-Dev/unity-project-template
    role: template
    sync: none
    harness: null
    notes: >-
      新規 Unity プロジェクト用の GitHub テンプレート(unity-sdd-template から分離)。SDD / linear-worker を
      持たない。生成先で linear-worker を動かす場合は Onboard Repository を、SDD を使う場合は
      unity-sdd-kit を導入する。

  - name: FacialControl
    github: Hidano-Dev/FacialControl
    role: execution
    sync: workflow   # .github/workflows/harness-sync.yml
    harness:
      config: pending   # 導入 PR マージ後に Registry Update で true にする
      linear:
        team: "Hidano"
        project: "FacialControl"
        labels:
          needs_human: "needs-human"
          needs_local: "needs-local"
      routine:
        name: "自律駆動ハーネス (FacialControl)"
        cron: "52 * * * *"   # UTC
        id: null   # Routine 作成後に Registry Update ワークフローで記入
        connectors: [Linear]
      status: pilot
    notes: >-
      2026-09-27 に Onboard Repository ワークフローで導入(PR: https://github.com/Hidano-Dev/FacialControl/pull/19)。

  - name: volumetric-laser-beam
    github: Hidano-Dev/volumetric-laser-beam
    role: execution
    sync: template-init   # unity-sdd-template 生成先(orchestration-sync.yml で追従)。harness-sync.yml への移行が必要(docs/changelog.md 2026-10-02)
    harness:
      config: true
      linear:
        team: "Hidano"
        project: "volumetric-laser-beam"
        labels:
          needs_human: "needs-human"
          needs_local: "needs-local"
      routine:
        name: "自律駆動ハーネス (volumetric-laser-beam)"
        cron: "52 * * * *"   # UTC
        id: null   # Routine 作成後に Registry Update ワークフローで記入
        connectors: [Linear]
      status: pilot
    notes: >-
      2026-09-29 に Onboard Repository ワークフローで導入。

  - name: oscdesk
    github: Hidano-Dev/oscdesk
    role: execution
    sync: workflow   # .github/workflows/harness-sync.yml
    harness:
      config: true
      linear:
        team: "Hidano"
        project: "oscdesk"
        labels:
          needs_human: "needs-human"
          needs_local: "needs-local"
      routine:
        name: "自律駆動ハーネス (oscdesk)"
        cron: "52 * * * *"   # UTC
        id: null   # Routine 作成後に Registry Update ワークフローで記入
        connectors: [Linear]
      status: pilot
    notes: >-
      2026-09-29 に Onboard Repository ワークフローで導入。
