# =============================================================================
# Policy Gate Recheck(取り込み側リポジトリに置く。agentic-dev-harness が配布)
# -----------------------------------------------------------------------------
# policy-gate.yml は pull_request_target で動く(定義を base から取り、PR に書き換えさせない)ため、
# レビューの提出・取り消しでは起動しない。人間が Approve したら gate を再評価させるため、
# ここでラベル policy-gate-recheck を付け直し、policy-gate の labeled イベントを起こす。
#
# - GITHUB_TOKEN で付けたラベルではワークフローが起動しないので App トークンを使う
#   (secret HARNESS_APP_ID / HARNESS_APP_PRIVATE_KEY。無ければ warning で終了 — その場合は
#   Actions 画面から policy-gate を手動で Re-run する)
# - このファイルは pull_request_review で動く(定義は PR 側)。書き換えられても「再評価が起きない」
#   だけで、gate を通す方向には働かない(判定は base 側の policy-gate が行う)
# - 配置先: .github/workflows/policy-gate-recheck.yml(Harness Sync が更新する)
# =============================================================================
name: Policy Gate Recheck

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

concurrency:
  group: policy-gate-recheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recheck:
    # fork の PR には secret が渡らないので動かさない
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check App secrets
        id: secrets
        env:
          APP_ID: ${{ secrets.HARNESS_APP_ID }}
          APP_KEY: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::warning::HARNESS_APP_ID / HARNESS_APP_PRIVATE_KEY が無いため policy-gate を再評価できません(Actions 画面から Re-run してください)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create App token
        if: steps.secrets.outputs.ok == 'true'
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}

      - name: Re-add recheck label
        if: steps.secrets.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL: policy-gate-recheck
        run: |
          gh label create "$LABEL" -R "$GITHUB_REPOSITORY" --color BFD4F2 \
            --description "policy-gate の再評価用(自動で付け外しされる)" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --remove-label "$LABEL" >/dev/null 2>&1 || true
          gh pr edit "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --add-label "$LABEL"
