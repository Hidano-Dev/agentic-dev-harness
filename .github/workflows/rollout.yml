# =============================================================================
# Harness Rollout(配布元専用。取り込み側には配らない)
# -----------------------------------------------------------------------------
# Harness Sync v2 の初回導入用。registry/repos.yaml の `sync: workflow` かつ harness.status が
# active / pilot のリポジトリに、本リポジトリ main の現在のコミットを適用した同期 PR を作る
# (以後は各リポジトリの harness-sync.yml が自走する)。
#
#   1. (configure_settings=true のとき)scripts/sync/configure_repo.py --apply --create-develop:
#      develop 作成・既定ブランチ変更・Allow auto-merge・develop / リリースブランチの branch protection。
#      リリースブランチは切り替え前の既定ブランチ(main / master 等)。ハーネスの必須チェックは
#      ワークフローが既定ブランチに揃ってから harness-sync.yml(--protection-only)が足す
#   2. scripts/sync/apply_sync.py で配布物を適用 → scripts/sync/publish_sync_pr.py で同期 PR
#      (ラベル harness-sync・自動マージ予約)。この実行で develop へ切り替えたら config の
#      github.default_branch / release_branch も set_branch_model.py で合わせる
#   この導入 PR(policy-gate.yml 等を初めて足す・config を変える)は人間がマージする
#
# main からのみ実行できる(取り込み側の policy-gate は配布元 main に含まれるコミットしか
# 同期として認めない)。
#
# 必要な secret(組織 secret 可): HARNESS_APP_ID / HARNESS_APP_PRIVATE_KEY
#   GitHub App の権限: Contents RW / Pull requests RW / Workflows RW / Issues RW(ラベル作成)/
#   Metadata R。configure_settings を使うなら Administration RW / Actions R / Checks R も。
#   App は対象リポジトリにインストールしておく
# =============================================================================
name: Harness Rollout

on:
  workflow_dispatch:
    inputs:
      repos:
        description: '対象(name または owner/name を空白・カンマ区切り。空なら台帳の全対象)'
        required: false
        type: string
        default: ''
      configure_settings:
        description: 'develop 作成・既定ブランチ変更・branch protection も行う(configure_repo.py --apply)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: harness-rollout
  cancel-in-progress: false

env:
  HARNESS_REF: main

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$HARNESS_REF" ]; then
            echo "::error::Rollout は $HARNESS_REF から実行してください(実行 ref: $GITHUB_REF)"; exit 1
          fi
      - uses: actions/checkout@v4
      - name: List targets
        id: targets
        env:
          REPOS: ${{ inputs.repos }}
        run: |
          t=$(python3 scripts/sync/registry_targets.py --file registry/repos.yaml --repos "$REPOS")
          echo "対象: $t"
          if [ "$t" = "[]" ]; then echo "::warning::配布対象がありません"; fi
          echo "targets=$t" >> "$GITHUB_OUTPUT"

  rollout:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.targets) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Split owner / name
        id: target
        env:
          REPO: ${{ matrix.repo }}
        run: |
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}

      - name: Checkout harness (this repository)
        uses: actions/checkout@v4
        with:
          path: harness
          fetch-depth: 0

      # configure_repo より前の既定ブランチ(main / master 等)を控える。develop へ切り替えたら
      # これがリリースブランチになる
      - name: Resolve prior default branch
        id: prior
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ matrix.repo }}
        run: echo "default_branch=$(gh api "repos/$REPO" --jq .default_branch)" >> "$GITHUB_OUTPUT"

      - name: Configure repository settings
        if: inputs.configure_settings
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ matrix.repo }}
          PRIOR: ${{ steps.prior.outputs.default_branch }}
        run: |
          args=()
          if [ "$PRIOR" != "develop" ]; then args=(--release-branch "$PRIOR"); fi
          python3 -I harness/scripts/sync/configure_repo.py --repo "$REPO" --create-develop --apply \
            "${args[@]}"

      - name: Resolve default branch
        id: repo
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ matrix.repo }}
          PRIOR: ${{ steps.prior.outputs.default_branch }}
        run: |
          branch=$(gh api "repos/$REPO" --jq .default_branch)
          echo "default_branch=$branch" >> "$GITHUB_OUTPUT"
          # configure_repo が実際に既定ブランチを develop へ切り替えたときだけ、config のブランチ設定も変える
          if [ "$PRIOR" != "develop" ] && [ "$branch" = "develop" ]; then
            echo "release_branch=$PRIOR" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ steps.repo.outputs.default_branch }}
          token: ${{ steps.app.outputs.token }}
          path: target

      - name: Apply harness and open sync PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ matrix.repo }}
          DEFAULT_BRANCH: ${{ steps.repo.outputs.default_branch }}
          RELEASE_BRANCH: ${{ steps.repo.outputs.release_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sha=$(git -C harness rev-parse HEAD)
          python3 -I harness/scripts/sync/apply_sync.py --harness harness --target target --sha "$sha" \
            --harness-repo "$GITHUB_REPOSITORY" --ref "$HARNESS_REF"
          # この実行で既定ブランチを develop へ切り替えた場合は config のブランチ設定も合わせる
          # (リリースブランチは切り替え前の既定ブランチ。config はコアなので、この同期 PR は
          # 人間の承認が要る。初回導入時に 1 度だけ)
          if [ -n "$RELEASE_BRANCH" ]; then
            python3 -I harness/scripts/sync/set_branch_model.py --target target \
              --default-branch develop --release-branch "$RELEASE_BRANCH"
          fi
          python3 -I harness/scripts/sync/publish_sync_pr.py --target target --repo "$REPO" \
            --base "$DEFAULT_BRANCH" --sha "$sha" --harness-repo "$GITHUB_REPOSITORY" --run-url "$RUN_URL"
