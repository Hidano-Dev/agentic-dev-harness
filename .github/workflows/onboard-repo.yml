# =============================================================================
# Onboard Repository — 新しいリポジトリへのハーネス導入を 1 回のフォーム入力で行う
# -----------------------------------------------------------------------------
# Actions タブから手動実行(workflow_dispatch)。docs/onboarding.md の手順のうち
# 「ファイルのコピー・項目埋め・台帳登録」に当たる部分を代行する:
#
#   1. Linear: チームの存在確認、リポジトリ名と同名のプロジェクトの確認(無ければ作成)、
#      needs-human / needs-local ラベルの作成(secret LINEAR_API_KEY がある場合のみ。無ければスキップ)
#   2. 対象リポジトリ: 配布物(.claude .codex .kiro .agents AGENTS.md)の同期、
#      harness-sync.yml の配置、CLAUDE.md への import 行、.kiro/orchestration/config.json の
#      生成 → PR を作成(または default branch へ直接 push)
#   3. 本リポジトリ: registry/repos.yaml にエントリを追加してコミット
#   4. ジョブサマリに「残りの手作業」と Routine 設定シート(プロンプト本文込み)を出力
#
# フォームで決めるのはチーム名・外部レビューボット・PR にするか直接 push か、だけ。
# 残りは規約で決める(Linear プロジェクト = リポジトリ名、ラベル = needs-human / needs-local、
# checks.fast は空でワーカーが推定、AGENTS.md は対象側にマーカー無しの独自ファイルがあれば触らない)。
# 変えたい場合は生成後の config.json を編集する。
#
# sdd_only を on にすると「SDD ワークフローのみ」の導入になる(config.json を作らず、
# Linear・Routine 関連はすべて省略。台帳には harness: null で登録)。
#
# 必要な secret(本リポジトリの Settings → Secrets and variables → Actions):
#   HARNESS_ONBOARD_TOKEN … 対象リポジトリへ書き込める fine-grained PAT
#                           (Contents: Read/Write, Pull requests: Read/Write,
#                            Workflows: Read/Write, Metadata: Read)。
#                           Workflows 権限は .github/workflows/ 配下を push するのに必要
#   LINEAR_API_KEY        … 任意。Linear の個人 API キー(ラベル・プロジェクト作成、存在確認に使う)
# 任意の variable(同じ画面の Variables タブ):
#   LINEAR_DEFAULT_TEAM   … linear_team を空欄にしたときに使うチーム名。本リポジトリを clone して
#                           使う人が自分のチーム名を置く(ワークフロー本文に固定値を書かない)
#
# 冪等: 同じリポジトリに再実行しても、既存の config.json / CLAUDE.md の import /
# 台帳エントリは上書きしない(配布物の同期のみ毎回行う)。
# =============================================================================
name: Onboard Repository

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: '対象リポジトリ(owner/name)'
        required: true
        type: string
      linear_team:
        description: 'Linear チーム名(config の linear.team)。空欄なら variable LINEAR_DEFAULT_TEAM を使う'
        required: false
        type: string
        default: ''
      sdd_only:
        description: 'SDD ワークフローのみ導入する(linear-worker なし。config.json / Linear / Routine を省略)'
        required: false
        type: boolean
        default: false
      review_bot:
        description: '外部レビューボット(config の review.bot。GitHub 側のレビュー設定は変えない)'
        required: false
        type: choice
        options: [codex, none]
        default: codex
      direct_push:
        description: 'この実行の導入コミットを PR にせずデフォルトブランチへ直接 push する(実行ごとの指定。保存されない)'
        required: false
        type: boolean
        default: false

# 同じ対象リポジトリへの実行だけを直列化する(重複判定 → ブランチ push → PR 作成の
# check-and-create が並行しないように)。group は対象ごとなので、別リポジトリの導入や
# Registry Update とは並行し得るが、台帳の同時更新は台帳ステップの
# 「既定ブランチの最新から追記 → push、競合したら再試行」ループで解決する。
# GitHub の仕様で group ごとの待機 run は 1 件のみ(同一対象を 3 件以上ほぼ同時に
# dispatch すると待機中の 1 件が取り消される)。同一対象の重複 dispatch は不要な操作なので許容する
concurrency:
  group: onboard-${{ inputs.target_repo }}
  cancel-in-progress: false

env:
  TARGET_REPO: ${{ inputs.target_repo }}
  LINEAR_TEAM_INPUT: ${{ inputs.linear_team }}
  LINEAR_DEFAULT_TEAM: ${{ vars.LINEAR_DEFAULT_TEAM }}
  SDD_ONLY: ${{ inputs.sdd_only }}
  REVIEW_BOT: ${{ inputs.review_bot }}
  DIRECT_PUSH: ${{ inputs.direct_push }}
  # LINEAR_TEAM(入力 → variable の順で決めた実値)は "Check inputs" ステップが GITHUB_ENV に設定する
  ONBOARD_BRANCH: chore/harness-onboarding
  ROUTINE_CRON: '52 * * * *'
  # 台帳(registry/repos.yaml)は常に本リポジトリの既定ブランチへ書く(tag / 作業ブランチから
  # dispatch されても台帳の置き場所は変えない)
  REGISTRY_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  onboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # registry/repos.yaml のコミット(本リポジトリ)
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
    defaults:
      run:
        shell: bash   # -eo pipefail(`python ... | tee` の失敗を取りこぼさない)
    steps:
      - name: Check inputs and secrets
        env:
          PAT: ${{ secrets.HARNESS_ONBOARD_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::secret HARNESS_ONBOARD_TOKEN が未設定です(対象リポジトリへ書き込める fine-grained PAT。冒頭コメント参照)"
            exit 1
          fi
          case "$TARGET_REPO" in
            */*) ;;
            *) echo "::error::target_repo は owner/name 形式で指定してください: '$TARGET_REPO'"; exit 1 ;;
          esac
          # 自由入力は前後の空白を落として正規化し、以降のステップは正規化後の値だけを見る
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          team=""
          if [ "$SDD_ONLY" = "true" ]; then
            echo "::notice::sdd_only のため SDD ワークフローのみ導入します(config.json / Linear / Routine は省略。linear_team は無視)"
          else
            team=$(trim "$LINEAR_TEAM_INPUT")
            if [ -z "$team" ]; then
              team=$(trim "$LINEAR_DEFAULT_TEAM")
              if [ -z "$team" ]; then
                echo "::error::linear_team が空欄で、variable LINEAR_DEFAULT_TEAM も未設定です。linear_team を入力するか、Settings → Secrets and variables → Actions → Variables に LINEAR_DEFAULT_TEAM を置くか、sdd_only を選んでください"
                exit 1
              fi
              echo "::notice::linear_team が空欄のため variable LINEAR_DEFAULT_TEAM('$team')を使います"
            fi
          fi
          echo "LINEAR_TEAM=$team" >> "$GITHUB_ENV"

      - name: Checkout harness (this repository)
        uses: actions/checkout@v4

      - name: Resolve target repository
        id: target
        env:
          GH_TOKEN: ${{ secrets.HARNESS_ONBOARD_TOKEN }}
        run: |
          json=$(gh repo view "$TARGET_REPO" --json nameWithOwner,defaultBranchRef,isTemplate) || {
            echo "::error::'$TARGET_REPO' を参照できません(存在しないか、PAT に権限がありません)"; exit 1; }
          repo=$(jq -r .nameWithOwner <<<"$json")
          branch=$(jq -r '.defaultBranchRef.name // empty' <<<"$json")
          if [ "$(jq -r .isTemplate <<<"$json")" = "true" ]; then
            echo "::error::'$repo' はテンプレートリポジトリです。生成先のリポジトリを指定してください"; exit 1
          fi
          if [ -z "$branch" ]; then
            echo "::error::'$repo' にはコミットがありません(既定ブランチ未作成)。README 等で初期コミットを作ってから再実行してください"; exit 1
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "name=${repo##*/}" >> "$GITHUB_OUTPUT"
          echo "default_branch=$branch" >> "$GITHUB_OUTPUT"
          echo "対象: $repo(default: $branch)"

      # 対象リポジトリを変更する前に、台帳のエントリ名(リポジトリ名)が別の owner/name に
      # 使われていないことを確認する(後段で台帳だけ登録できずに終わる事態を防ぐ)
      - name: Check registry entry name
        env:
          NAME: ${{ steps.target.outputs.name }}
          REPO: ${{ steps.target.outputs.repo }}
        run: |
          # 台帳は常に既定ブランチ版を見る(作業ブランチ / tag から dispatch されても古い台帳で判定しない)。
          # checkout の fetch refspec に依存せず、明示的に origin/<既定ブランチ> を作る
          git fetch -q origin "+refs/heads/$REGISTRY_BRANCH:refs/remotes/origin/$REGISTRY_BRANCH"
          git show "origin/$REGISTRY_BRANCH:registry/repos.yaml" > /tmp/repos-default.yaml
          python3 scripts/onboard/registry.py --file /tmp/repos-default.yaml check --name "$NAME" --github "$REPO"

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.target.outputs.repo }}
          ref: ${{ steps.target.outputs.default_branch }}
          token: ${{ secrets.HARNESS_ONBOARD_TOKEN }}
          path: target

      # 対象リポジトリ由来の値(リポジトリ名・既定ブランチ名など)は run 本文へ `${{ }}` で
      # 直接展開せず、必ず env 経由の引用済み変数として渡す(スクリプトインジェクション対策)
      - name: Bootstrap target (assets, sync workflow, CLAUDE.md, config.json)
        id: bootstrap
        env:
          REPO: ${{ steps.target.outputs.repo }}
          DEFAULT_BRANCH: ${{ steps.target.outputs.default_branch }}
        run: |
          # 書き込み先が submodule(gitlink, mode 160000)だと、コピーしても superproject の
          # git add には乗らず、配布物が欠けたまま成功に見えるので先に拒否する
          gitlinks=$(git -C target ls-files --stage -- .claude .codex .kiro .agents AGENTS.md CLAUDE.md .github \
            | awk '$1 == "160000" { print $4 }')
          if [ -n "$gitlinks" ]; then
            echo "::error::対象リポジトリで同期先が submodule(gitlink)になっています: $(echo "$gitlinks" | tr '\n' ' ')— 通常のディレクトリにしてから再実行してください"
            exit 1
          fi
          python3 scripts/onboard/bootstrap_target.py \
            --harness . --target target \
            --repo "$REPO" \
            --default-branch "$DEFAULT_BRANCH" \
            --linear-team "$LINEAR_TEAM" --review-bot "$REVIEW_BOT" \
            --result /tmp/bootstrap.json
          echo "sync_mode=$(jq -r .sync_mode /tmp/bootstrap.json)" >> "$GITHUB_OUTPUT"
          echo "config=$(jq -r .config /tmp/bootstrap.json)" >> "$GITHUB_OUTPUT"

      # Linear の準備は bootstrap の後で行い、フォーム入力ではなく config.json の実値
      # (既存 config があればその team / project / ラベル名)に対して検証・作成する。
      # プロジェクト(新規 config ではリポジトリ名)は無ければ作る。
      # 実値が誤っていればここで失敗し、対象リポジトリへの push / PR には進まない
      - name: Linear — verify team, ensure project and labels
        id: linear
        if: env.SDD_ONLY != 'true' && env.LINEAR_API_KEY != ''
        run: |
          team=$(jq -r '.effective.team // empty' /tmp/bootstrap.json)
          project=$(jq -r '.effective.project // empty' /tmp/bootstrap.json)
          needs_human=$(jq -r '.effective.needs_human // "needs-human"' /tmp/bootstrap.json)
          needs_local=$(jq -r '.effective.needs_local // "needs-local"' /tmp/bootstrap.json)
          if [ -z "$team" ]; then
            echo "::error::config.json から linear.team を取得できませんでした"; exit 1
          fi
          python3 scripts/onboard/linear_setup.py \
            --team "$team" --project "$project" \
            --needs-human "$needs_human" --needs-local "$needs_local" | tee /tmp/linear.log
          echo "note=$(paste -sd '/' /tmp/linear.log | sed 's#/# / #g')" >> "$GITHUB_OUTPUT"

      # API キー無しでも config はリポジトリ名のプロジェクトで絞り込むので、プロジェクトが無いと
      # ワーカーは Issue を拾えない。ラベルと合わせて手動作成をサマリの手作業に載せる
      - name: Linear — skipped
        id: linear_skipped
        if: env.SDD_ONLY != 'true' && env.LINEAR_API_KEY == ''
        run: |
          team=$(jq -r '.effective.team // empty' /tmp/bootstrap.json)
          project=$(jq -r '.effective.project // empty' /tmp/bootstrap.json)
          needs_human=$(jq -r '.effective.needs_human // "needs-human"' /tmp/bootstrap.json)
          needs_local=$(jq -r '.effective.needs_local // "needs-local"' /tmp/bootstrap.json)
          manual="チーム $team に"
          if [ -n "$project" ]; then manual="$manual プロジェクト \`$project\`(リポジトリ名と同名)と"; fi
          manual="$manual ラベル \`$needs_human\` / \`$needs_local\`"
          echo "::warning::secret LINEAR_API_KEY が無いため Linear の存在確認・作成をスキップしました。手動で作成してください: $manual"
          echo "note=スキップ(LINEAR_API_KEY 未設定)。手動作成が必要: $manual" >> "$GITHUB_OUTPUT"
          echo "manual=$manual" >> "$GITHUB_OUTPUT"

      - name: Commit and open PR (or push) in target
        id: publish
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.HARNESS_ONBOARD_TOKEN }}
          REPO: ${{ steps.target.outputs.repo }}
          DEFAULT_BRANCH: ${{ steps.target.outputs.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          DOCS_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/onboarding.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 対象側の .gitignore が配布物や config を除外していると、書いたのにコミットされず
          # 「導入済み」に見えてしまう。git add -A が落とすのは「未追跡かつ ignore 対象」の
          # ファイルなので、書き込んだパス配下でそれに該当するファイルを個別に列挙して失敗させる
          mapfile -t roots < <(jq -r '.assets_synced[]' /tmp/bootstrap.json)
          roots+=(CLAUDE.md .kiro/orchestration/config.json .github/workflows/harness-sync.yml)
          ignored=$(git ls-files --others --ignored --exclude-standard -- "${roots[@]}" 2>/dev/null || true)
          if [ -n "$ignored" ]; then
            echo "::error::対象リポジトリの .gitignore が配布ファイルを除外しています(コミットされません): $(echo "$ignored" | tr '\n' ' ')— 除外を外してから再実行してください"
            exit 1
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし(導入済み)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [ "$SDD_ONLY" = "true" ]; then
            git commit -m "chore: onboard agentic-dev-harness (SDD workflow)"
          else
            git commit -m "chore: onboard agentic-dev-harness (SDD workflow + linear-worker)"
          fi

          if [ "$DIRECT_PUSH" = "true" ]; then
            git push origin "HEAD:$DEFAULT_BRANCH"
            echo "pushed_to=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 導入 PR が開いたままなら二重に作らない(ブランチ接頭辞で判定)
          # gh pr list の既定は先頭 30 件なので、open PR が多いリポジトリでも取りこぼさないよう上限を広げる
          existing=$(gh pr list -R "$REPO" --state open --limit 1000 --json url,headRefName \
            | jq -r --arg p "$ONBOARD_BRANCH" '[.[] | select(.headRefName | startswith($p)) | .url] | first // empty')
          if [ -n "$existing" ]; then
            echo "::error::導入 PR が既に開いています: $existing — 先にマージまたはクローズしてください"
            exit 1
          fi
          # 実行ごとに固有のブランチ名にし、既存ブランチを force で上書きしない
          branch="$ONBOARD_BRANCH-$RUN_NUMBER"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::ブランチ $branch が既に存在します(同じ run 番号での再実行)。削除してから再実行してください"
            exit 1
          fi
          git checkout -b "$branch"
          git push -u origin "$branch"

          {
            if [ "$SDD_ONLY" = "true" ]; then
              echo "agentic-dev-harness の SDD ワークフロー(kiro commands / skills / rules)を導入します。"
            else
              echo "agentic-dev-harness(SDD ワークフロー + Linear 駆動の自律ワーカー linear-worker)を導入します。"
            fi
            echo "[Onboard Repository]($RUN_URL) ワークフローが生成した PR です。"
            echo
            echo "## 内容"
            echo
            echo "- 配布物の同期: $(jq -r '.assets_synced | join(", ")' /tmp/bootstrap.json)"
            if [ "$(jq -r .agents_md /tmp/bootstrap.json)" = "kept" ]; then
              echo "- \`AGENTS.md\`: 独自ファイル(マーカー無し)のため上書きしていない。同期ワークフローも上書きしない"
            fi
            case "$(jq -r .sync_workflow /tmp/bootstrap.json)" in
              written)       echo "- \`.github/workflows/harness-sync.yml\` を配置(Actions から手動実行で最新化)" ;;
              updated)       echo "- 既存の同期ワークフロー(旧版)の同期対象から \`AGENTS.md\` を外した(独自ファイルを守るため。新版に差し替えればマーカー判定で自動的に守られる)" ;;
              template-init) echo "- 同期ワークフローは既存の \`orchestration-sync.yml\` を使用" ;;
              *)             echo "- 同期ワークフローは既存の \`harness-sync.yml\` を使用" ;;
            esac
            echo "- \`CLAUDE.md\`: $(jq -r .claude_md /tmp/bootstrap.json)(\`@.claude/rules/sdd-workflow.md\` の import)"
            echo "- \`.kiro/orchestration/config.json\`: $(jq -r .config /tmp/bootstrap.json)"
            if [ "$SDD_ONLY" != "true" ]; then
              echo
              echo "## マージ前に確認すること"
              echo
              echo "- \`config.json\` の値(linear.team / project = リポジトリ名 / labels / review.bot)。変えたい項目はここで編集する"
              echo "- \`auto_merge.enabled\` は true(ゲートを通過した PR は自動マージされる)。先にゲートの動きを確認したい場合は false にして数回まわしてから true に戻す"
              echo "- \`checks.fast\` は空でもワーカーが CI 定義等から推定して実行する。固定したいコマンドがあれば入れる"
            fi
            echo
            echo "導入手順の全体: $DOCS_URL"
          } > /tmp/pr-body.md

          url=$(gh pr create -R "$REPO" --base "$DEFAULT_BRANCH" --head "$branch" \
            --title "chore: onboard agentic-dev-harness" --body-file /tmp/pr-body.md)
          echo "pr_url=$url" >> "$GITHUB_OUTPUT"
          echo "PR: $url"

      # 台帳更新は既定ブランチを checkout した別 worktree(/tmp/registry-wt)で行う。
      # 実行中 ref(作業ブランチ / tag)のスクリプトはそのまま使い、既定ブランチから取るのは
      # 台帳ファイルだけにするため。競合(別の Onboard / Registry Update と同時)は、
      # 既定ブランチの最新から台帳を作り直して push を再試行することで解決する
      - name: Register in registry/repos.yaml
        id: registry
        env:
          NAME: ${{ steps.target.outputs.name }}
          REPO: ${{ steps.target.outputs.repo }}
          SYNC_MODE: ${{ steps.bootstrap.outputs.sync_mode }}
          CONFIG_RESULT: ${{ steps.bootstrap.outputs.config }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          PUSHED_TO: ${{ steps.publish.outputs.pushed_to }}
        run: |
          # config が既定ブランチに存在する状態(直接 push 済み、または導入前から存在)なら true、
          # 導入 PR の中で新規作成した場合はマージ待ちなので pending
          if [ -n "$PUSHED_TO" ] || [ "$CONFIG_RESULT" = "exists" ]; then config_state=true; else config_state=pending; fi
          date_utc=$(date -u +%F)
          wt=/tmp/registry-wt
          git fetch -q origin "+refs/heads/$REGISTRY_BRANCH:refs/remotes/origin/$REGISTRY_BRANCH"
          git worktree add -q --detach "$wt" "origin/$REGISTRY_BRANCH"
          git -C "$wt" config user.name "github-actions[bot]"
          git -C "$wt" config user.email "github-actions[bot]@users.noreply.github.com"

          attempt=0
          while :; do
            attempt=$((attempt + 1))
            git fetch -q origin "+refs/heads/$REGISTRY_BRANCH:refs/remotes/origin/$REGISTRY_BRANCH"
            git -C "$wt" reset -q --hard "origin/$REGISTRY_BRANCH"
            if [ "$SDD_ONLY" = "true" ]; then
              python3 scripts/onboard/registry.py --file "$wt/registry/repos.yaml" add --sdd-only \
                --name "$NAME" --github "$REPO" --sync "$SYNC_MODE" \
                --date "$date_utc" --pr-url "$PR_URL" | tee /tmp/registry.log
            else
              # 台帳にはフォーム入力ではなく config.json の実値(新規生成なら入力と同じ、
              # 既存 config ならその値)を載せる
              team=$(jq -r '.effective.team // empty' /tmp/bootstrap.json)
              project=$(jq -r '.effective.project // empty' /tmp/bootstrap.json)
              needs_human=$(jq -r '.effective.needs_human // "needs-human"' /tmp/bootstrap.json)
              needs_local=$(jq -r '.effective.needs_local // "needs-local"' /tmp/bootstrap.json)
              python3 scripts/onboard/registry.py --file "$wt/registry/repos.yaml" add \
                --name "$NAME" --github "$REPO" --sync "$SYNC_MODE" --config-state "$config_state" \
                --team "$team" --project "$project" \
                --needs-human "$needs_human" --needs-local "$needs_local" \
                --routine-name "自律駆動ハーネス ($NAME)" --cron "$ROUTINE_CRON" \
                --date "$date_utc" --pr-url "$PR_URL" | tee /tmp/registry.log
            fi
            git -C "$wt" add registry/repos.yaml
            if git -C "$wt" diff --cached --quiet; then
              # ログは複数行になり得るので 1 行に畳んでから output にする
              echo "note=$(paste -sd '/' /tmp/registry.log | sed 's#/# / #g')" >> "$GITHUB_OUTPUT"
              break
            fi
            git -C "$wt" commit -q -m "chore(registry): add $NAME (onboarded via workflow)"
            if git -C "$wt" push origin "HEAD:$REGISTRY_BRANCH"; then
              echo "note=エントリを追加してコミット($(git -C "$wt" rev-parse --short HEAD))" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$attempt" -ge 5 ]; then
              echo "::error::registry/repos.yaml の push が $attempt 回競合しました。Registry Update または手動で登録してください"
              exit 1
            fi
            echo "push が競合したため再試行します($attempt)"
            sleep $((attempt * 5))
          done

      - name: Write summary (remaining manual steps + Routine sheet)
        env:
          REPO: ${{ steps.target.outputs.repo }}
          DEFAULT_BRANCH: ${{ steps.target.outputs.default_branch }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          PUSHED_TO: ${{ steps.publish.outputs.pushed_to }}
          LINEAR_NOTE: ${{ steps.linear.outputs.note || steps.linear_skipped.outputs.note }}
          LINEAR_MANUAL: ${{ steps.linear_skipped.outputs.manual }}
          REGISTRY_NOTE: ${{ steps.registry.outputs.note }}
          ENTRY_NAME: ${{ steps.registry.outputs.entry_name }}
        run: |
          extra=()
          if [ "$SDD_ONLY" = "true" ]; then extra+=(--sdd-only); fi
          python3 scripts/onboard/routine_sheet.py \
            --harness . --repo "$REPO" --default-branch "$DEFAULT_BRANCH" \
            --cron "$ROUTINE_CRON" --result /tmp/bootstrap.json \
            --pr-url "$PR_URL" --pushed-to "$PUSHED_TO" \
            --linear-note "${LINEAR_NOTE:-スキップ(LINEAR_API_KEY 未設定)}" --linear-manual "$LINEAR_MANUAL" \
            --registry-note "$REGISTRY_NOTE" --entry-name "$ENTRY_NAME" "${extra[@]}" >> "$GITHUB_STEP_SUMMARY"
